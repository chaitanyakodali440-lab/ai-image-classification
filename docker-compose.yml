version: '3.8'

services:
  # Python Flask + TensorFlow MobileNetV2 Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_classification_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/classification.db
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - ai_network

  # React + Vite + Tailwind Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_classification_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  backend_sqlite_data:
    name: ai_classification_sqlite_data
