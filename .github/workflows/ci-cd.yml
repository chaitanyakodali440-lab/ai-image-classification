name: CI/CD Pipeline - AI Image Classification System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Backend Testing & Linting
  # -------------------------------------------------------------
  backend-test:
    name: Backend Pytest & AI Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8

      - name: Backend Lint Check (Code Quality)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest -v tests/test_api.py

  # -------------------------------------------------------------
  # Job 2: Frontend Lint & Production Build
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Lint & Vite Production Build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Application
        run: |
          cd frontend
          npm run build

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Docker Images Build & Smoke Test
  # -------------------------------------------------------------
  docker-build:
    name: Build & Verify Docker Containers
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-image-classification-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-image-classification-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 4: Continuous Deployment to Cloud (Render)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production (Render)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deployment Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering automated deployment on Render..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "✅ Deployment webhook triggered successfully! HTTP $HTTP_CODE"
            else
              echo "❌ Render deployment webhook returned HTTP $HTTP_CODE"
              exit 1
            fi
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret not configured in repository."
            echo "CI pipeline completed all tests and Docker verification successfully."
          fi
